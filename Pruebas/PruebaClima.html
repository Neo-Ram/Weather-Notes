<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="PruebaClima.css">
    <title>Prueba clima</title>
</head>

<body>
    <div class="container">
        <div class="left-info">
            <div class="pic-gradient"></div>
            <div class="today-info">
                <h2>Friday</h2>
                <span>28 de july 2024</span>
                <div>
                    <i class='bx bx-current-location'></i>
                    <span> Los Mochis, Sinaloa</span>
                </div>
            </div>
            <div class="today-weather">
                <i class='bx bxs-sun' ></i>
                <h1 class="weather-temp">
                    37°C
                </h1>
                <h3>Sunny</h3>
            </div>
        </div>

        <div class="right-info">
            <div class="day-info">
                <div>
                    <span class="tittle">PRECIPITATION</span>
                    <span class="value">4 %</span>
                </div>
                <div>
                    <span class="tittle">HUMIDITY</span>
                    <span class="value">34 %</span>
                </div>
                <div>
                    <span class="tittle">WIND SPEED</span>
                    <span class="value">5 km/h</span>
                </div>
            </div>

            <ul class="days-list">
                <li>
                    <i class='bx bx-cloud' ></i>
                    <span>Sat</span>
                    <span class="day-temp">39°C</span>
                </li>
                <li>
                    <i class='bx bx-sun'></i>
                    <span>Sun</span>
                    <span class="day-temp">36°C</span>
                </li>
                <li>
                    <i class='bx bx-cloud-rain' ></i>
                    <span>Mon</span>
                    <span class="day-temp">35°C</span>
                </li>
                <li>
                    <i class='bx bx-cloud-drizzle' ></i>
                    <span>Tue</span>
                    <span class="day-temp">39°C</span>
                </li>
            </ul>
    
                <!-- Localización -->
            <div class="btn-container">
                <button class="loc-button">Seach Location</button>
            </div>
        </div>

    </div>
    
</body>
</html>
